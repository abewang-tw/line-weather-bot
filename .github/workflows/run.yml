name: 每週天氣提醒機器人

on:
  schedule:
    # 台灣時間每週一早上 07:30（對應 UTC 週日 23:30）
    - cron: '30 23 * * 0'
  workflow_dispatch: # 保留手動按鈕隨時測試

jobs:
  send-weather:
    runs-on: ubuntu-latest
    steps:
      - name: 簽出專案代碼
        uses: actions/checkout@v3

      - name: 設定 Python 環境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 安裝相依套件
        run: |
          pip install requests

      - name: 執行天氣腳本
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_ACCESS_TOKEN }}
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
        run: python weather.py
